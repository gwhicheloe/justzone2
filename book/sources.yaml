  status: abstract
  chapters: [easy-riding, beyond-performance]
  notes: "55 endurance-trained men: peak fat oxidation 0.52 +/- 0.15 g/min at 62.5 +/- 9.8% VO2max. Large variation between individuals. Typical error of Fatmax about 9.5%."

- key: achten2003feeding
  citation: "Achten J, Jeukendrup AE. The effect of pre-exercise carbohydrate feedings on the intensity that elicits maximal fat oxidation. J Sports Sci. 2003;21:1017-1024."
  doi: 10.1080/02640410310001641403
  pmid: 14748459
  status: abstract
  chapters: [easy-riding]
  notes: "11 moderately trained people, fasted overnight; 75 g glucose 45 min before a graded test lowered peak fat oxidation from 0.46 to 0.33 g/min (28%) and Fatmax from 60.1 to 52.0% VO2max."

- key: achten2004
  citation: "Achten J, Jeukendrup AE. Relation between plasma lactate concentration and fat oxidation rates over a wide range of exercise intensities. Int J Sports Med. 2004;25:32-37."

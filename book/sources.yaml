- key: joynercoyle2008
  citation: "Joyner MJ, Coyle EF. Endurance exercise performance: the physiology of champions. J Physiol. 2008;586:35-44."
  doi: 10.1113/jphysiol.2007.143834
  pmcid: PMC2375555
  status: fulltext
  chapters: [limits, durability]
  notes: "Read via the PMC web page (tool summary of sections) on 4 Oct 2026; re-check exact figures against the PDF before final. Model: performance VO2 = VO2max x fraction at LT; x efficiency = performance power. Elite VO2max 70-85, women ~10% lower; LT ~60% VO2max untrained vs 75-90% elite; cycling GE 18.5-23.5% at 300 W; efficiency varies 20-30% in cycling."


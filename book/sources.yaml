- key: jones2024
  citation: "Jones AM. The fourth dimension: physiological resilience as an independent determinant of endurance exercise performance. J Physiol. 2024."
  doi: 10.1113/jp284205
  pmid: 37606604
  status: fulltext
  chapters: [limits, durability]
  notes: "Review arguing resilience/durability is a fourth determinant alongside VO2max, fractional utilisation and efficiency. Published PDF in papers/ (5 Oct 2026); sections on the fall in CP, its range (0.4-32% across the Clark studies, p4) and candidate mechanisms read. Read the rest before citing anything else from it."

- key: joneskirby2025
  citation: "Jones AM, Kirby BS. Physiological resilience: what is it and how might it be trained? Scand J Med Sci Sports. 2025."
  doi: 10.1111/sms.70032
  pmid: 40024804
  pmcid: PMC11872681
  status: fulltext
  chapters: [durability]
  notes: "Narrative review, read in full 5 Oct 2026. Says data are scant and no longitudinal study has targeted resilience; suggests years of volume, long sessions, hard efforts within them, heavy strength training. Central to 'what trains it'."

- key: joynercoyle2008
  citation: "Joyner MJ, Coyle EF. Endurance exercise performance: the physiology of champions. J Physiol. 2008;586:35-44."

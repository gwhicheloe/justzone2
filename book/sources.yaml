  pmid: 14750010
  status: abstract
  chapters: [easy-riding]
  notes: "33 moderately trained endurance athletes, cycle ergometer. Fatmax 63% VO2max; first rise of lactate above baseline 61%; no difference, correlated. Feeding state not in the abstract."


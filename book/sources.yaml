- key: aagaard2011
  citation: "Aagaard P, Andersen JL, Bennekou M, et al. Effects of resistance training on endurance capacity and muscle fiber composition in young top-level cyclists. Scand J Med Sci Sports. 2011;21:e298-e307."
  doi: 10.1111/j.1600-0838.2010.01283.x
  pmid: 21362056
  status: abstract
  chapters: [strength]
  notes: "14 young elite cyclists, 16 weeks. Strength and rate of force development +12 to 20%; 45-min capacity +8% with strength only; 5-min +3 to 4% in both; IIX to IIA shift; VO2max unchanged. Group sizes and allocation not in the abstract."

- key: achten2002
  citation: "Achten J, Gleeson M, Jeukendrup AE. Determination of the exercise intensity that elicits maximal fat oxidation. Med Sci Sports Exerc. 2002;34:92-97."
  doi: 10.1097/00005768-200201000-00015
  pmid: 11782653
  status: abstract
  chapters: [easy-riding, beyond-performance]
  notes: "18 moderately trained cyclists. Fatmax at 64% VO2max, 74% HRmax; Fatmax zone (within 10% of peak) 55-72% VO2max; fat oxidation drops markedly above it and is negligible above 89% VO2max."

- key: achten2003
  citation: "Achten J, Jeukendrup AE. Maximal fat oxidation during exercise in trained men. Int J Sports Med. 2003;24:603-608."
  doi: 10.1055/s-2003-43265

  citation: "Clark IE, Vanhatalo A, Thompson C, et al. Changes in the power-duration relationship following prolonged exercise: estimation using conventional and all-out protocols and relationship with muscle glycogen. Am J Physiol Regul Integr Comp Physiol. 2019;317:R59-R67."

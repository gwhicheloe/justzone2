- key: weston2014
  citation: "Weston KS, Wisløff U, Coombes JS. High-intensity interval training in patients with lifestyle-induced cardiometabolic disease: a systematic review and meta-analysis. Br J Sports Med. 2014;48:1227-1234."
  doi: 10.1136/bjsports-2013-092576
  pmid: 24144531
  status: abstract
  chapters: [beyond-performance]
  notes: "10 studies, 273 patients; HIIT raised VO2peak 3.03 mL/kg/min more than MICT (about 9.1%), 'almost double'."

- key: wisloff2007
  citation: "Wisløff U, Støylen A, Loennechen JP, Bruvold M, Rognmo Ø, Haram PM, et al. Superior cardiovascular effect of aerobic interval training versus moderate continuous training in heart failure patients: a randomized study. Circulation. 2007;115:3086-3094."
  doi: 10.1161/circulationaha.106.675041
  pmid: 17548726
  status: abstract
  chapters: [designing-intervals, special-cases]
  notes: "27 heart-failure patients aged 75.5: intervals at 95% peak HR vs 70%, 3/week, 12 weeks: VO2peak +46% vs +14%; LV remodelling reversed with intervals only."

- key: woltmann2015
  citation: "Woltmann ML, Foster C, Porcari JP, et al. Evidence that the talk test can be used to regulate exercise intensity. J Strength Cond Res. 2015;29:1248-1254."
  doi: 10.1519/jsc.0000000000000811
  pmid: 25536539
  status: abstract
  chapters: [finding-zones]
  notes: "16 active volunteers; 30-min runs at each talk-test stage: 16/16 completed last positive, 13/16 equivocal, 2/16 negative. Full text seen only through a summarising tool, from a third-party copy: it attributes the talk test to 'Professor Grayson', 1939, with no reference, and says stages were 2 min and the passage the Pledge of Allegiance."

- key: yamamoto2010
  citation: "Yamamoto LM, Klau JF, Casa DJ, et al. The effects of resistance training on road cycling performance among highly trained cyclists: a systematic review. J Strength Cond Res. 2010;24:560-566."
  doi: 10.1519/jsc.0b013e3181c86583
  pmid: 20072042
  status: abstract
  chapters: [strength]
  notes: "Five RCTs to September 2009. Two found no improvement (strength added on top); three improved (strength replaced some endurance training)."

- key: yang2025
  citation: "Yang Q, Wang J, Guan D. Comparison of different interval training methods on athletes' oxygen uptake: a systematic review with pairwise and network meta-analysis. BMC Sports Sci Med Rehabil. 2025;17:156."
  doi: 10.1186/s13102-025-01191-6
  pmid: 40605061
  status: fulltext
  chapters: [designing-intervals, how-many]
  notes: "Full text in papers/ (frequency sections read). 51 studies, 1,261 athletes; HIIT 3/week g 1.21 vs 2/week 0.69 (p = 0.07); peak effect at ~140 s work bouts."

- key: yeh1983
  citation: "Yeh MP, Gardner RM, Adams TD, Yanowitz FG, Crapo RO. 'Anaerobic threshold': problems of determination and validation. J Appl Physiol Respir Environ Exerc Physiol. 1983;55:1178-1186."
  doi: 10.1152/jappl.1983.55.4.1178
  pmid: 6629951
  status: abstract
  chapters: [finding-zones]
  notes: "Eight subjects, ramp tests. Four independent exercise physiologists read the threshold from the gas data: average range 16% for a given subject (units not stated in the abstract)."

- key: zanini2024
  citation: "Zanini M, Folland JP, Blagrove RC. Durability of running economy: differences between quantification methods and performance status in male runners. Med Sci Sports Exerc. 2024;56:2230-2240."
  doi: 10.1249/mss.0000000000003499
  pmid: 38857519
  status: abstract
  chapters: [durability]
  notes: "44 male runners, 90 min at LT1. Oxygen cost rose 2.4% in the faster subgroup vs 4.5% in the slower. The long-run-habit comparison (3.1 vs 6.0%) is reported by Jones & Kirby 2025, not in this abstract."


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 526" width="680" height="526" role="img" aria-label="Weekly hours below and above the first lactate threshold for eleven champion skiers: 15.2 and 1.3 in general preparation, 14.4 and 1.3 in specific preparation, 9.8 and 1.4 in competition, beside an illustrative seven-hour week with 5.7 and 1.3">
<rect width="680" height="526" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >The champions’ hard training stayed near 1.3 hours a week while the easy</text>
<text x="30.0" y="52.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >hours changed</text>
<text x="30.0" y="76.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Weekly hours of endurance training below and above the first lactate threshold:</text>
<text x="30.0" y="95.4" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >eleven Olympic and world champion skiers in the year of their gold medal, by phase of</text>
<text x="30.0" y="114.8" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >the season.</text>
<rect x="230" y="154.2" width="12" height="12" fill="#e6e6e6" stroke="#555555" stroke-width="0.75"/>
<text x="250.0" y="165.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >Below the first threshold</text>
<rect x="480" y="154.2" width="12" height="12" fill="#1a1a1a"/>
<text x="500.0" y="165.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >Above it</text>
<line x1="230.0" y1="184.2" x2="230.0" y2="428.2" stroke="#e6e6e6" stroke-width="1"/>
<text x="230.0" y="450.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >0</text>
<line x1="305.0" y1="184.2" x2="305.0" y2="428.2" stroke="#e6e6e6" stroke-width="1"/>
<text x="305.0" y="450.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >5</text>
<line x1="380.0" y1="184.2" x2="380.0" y2="428.2" stroke="#e6e6e6" stroke-width="1"/>
<text x="380.0" y="450.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >10</text>
<line x1="455.0" y1="184.2" x2="455.0" y2="428.2" stroke="#e6e6e6" stroke-width="1"/>
<text x="455.0" y="450.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >15</text>
<text x="342.5" y="476.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >Hours a week</text>
<text x="214.0" y="210.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="end" font-weight="600" >General preparation</text>
<text x="214.0" y="229.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="end" font-weight="400" >June to October</text>
<rect x="230.0" y="203.2" width="226.0" height="22" fill="#e6e6e6"/>
<rect x="458.0" y="203.2" width="19.5" height="22" fill="#1a1a1a"/>
<text x="450.0" y="219.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="end" font-weight="400" >15.2</text>
<text x="487.5" y="210.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >1.3 h hard</text>
<text x="487.5" y="229.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start" font-weight="400" >8% of 16.5 h</text>
<text x="214.0" y="262.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="end" font-weight="600" >Specific preparation</text>
<text x="214.0" y="281.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="end" font-weight="400" >November and December</text>
<rect x="230.0" y="255.2" width="214.0" height="22" fill="#e6e6e6"/>
<rect x="446.0" y="255.2" width="19.5" height="22" fill="#1a1a1a"/>
<text x="438.0" y="271.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="end" font-weight="400" >14.4</text>
<text x="475.5" y="262.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >1.3 h hard</text>
<text x="475.5" y="281.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start" font-weight="400" >8% of 15.7 h</text>
<text x="214.0" y="314.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="end" font-weight="600" >Competition</text>
<text x="214.0" y="333.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="end" font-weight="400" >January to March</text>
<rect x="230.0" y="307.2" width="145.0" height="22" fill="#e6e6e6"/>
<rect x="377.0" y="307.2" width="21.0" height="22" fill="#1a1a1a"/>
<text x="369.0" y="323.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="end" font-weight="400" >9.8</text>
<text x="408.0" y="314.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >1.4 h hard</text>
<text x="408.0" y="333.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start" font-weight="400" >12% of 11.2 h</text>
<line x1="30" y1="359.2" x2="650" y2="359.2" stroke="#bdbdbd" stroke-width="1" stroke-dasharray="3 4"/>
<text x="214.0" y="396.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="end" font-weight="600" >A seven-hour week</text>
<text x="214.0" y="415.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="end" font-weight="400" >an illustration</text>
<rect x="230.0" y="389.2" width="83.5" height="22" fill="#e6e6e6"/>
<rect x="315.5" y="389.2" width="19.5" height="22" fill="#1a1a1a"/>
<text x="307.5" y="405.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="end" font-weight="400" >5.7</text>
<text x="345.0" y="396.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >1.3 h hard</text>
<text x="345.0" y="415.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="start" font-weight="400" >19% of 7.0 h</text>
<text x="30.0" y="512.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >The last row is not data. It shows the same hard training inside a seven-hour week.</text>
</svg>

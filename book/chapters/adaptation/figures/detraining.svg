<text x="60.0" y="44.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >0</text>
<line x1="70" y1="92.5" x2="540" y2="92.5" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="96.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >−5%</text>
<line x1="70" y1="145.0" x2="540" y2="145.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="149.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >−10%</text>
<line x1="70" y1="197.5" x2="540" y2="197.5" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="201.5" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >−15%</text>
<line x1="70" y1="250.0" x2="540" y2="250.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="254.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >−20%</text>
<text x="70.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >last session</text>

<circle cx="187.5" cy="113.5" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<circle cx="383.3" cy="208.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<circle cx="540.0" cy="208.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<text x="199.5" y="105.5" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="600" >−7%</text>
<text x="383.3" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600" >−16%</text>
<text x="552.0" y="204.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="start" font-weight="400" >still above</text>
<text x="552.0" y="220.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="start" font-weight="400" >people who had</text>
<text x="552.0" y="236.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="start" font-weight="400" >never trained</text>

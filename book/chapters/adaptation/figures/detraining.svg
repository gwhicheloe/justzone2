<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="VO2max over 84 days after stopping endurance training">
<rect width="680" height="340" fill="#ffffff"/>
<line x1="70" y1="40.0" x2="520" y2="40.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="60.0" y="45.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >0</text>
<line x1="70" y1="93.0" x2="520" y2="93.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="98.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >−5%</text>
<line x1="70" y1="146.0" x2="520" y2="146.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="151.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >−10%</text>
<line x1="70" y1="199.0" x2="520" y2="199.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="204.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >−15%</text>
<line x1="70" y1="252.0" x2="520" y2="252.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="257.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >−20%</text>
<text x="70.0" y="278.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >last session</text>
<text x="182.5" y="278.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >day 21</text>
<text x="370.0" y="278.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >day 56</text>
<text x="520.0" y="278.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >day 84</text>
<text x="295.0" y="308.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >Change in VO₂max after training stopped</text>
<polyline points="70.0,40.0 182.5,114.2 370.0,209.6 520.0,209.6" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
<circle cx="70.0" cy="40.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<circle cx="182.5" cy="114.2" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<circle cx="370.0" cy="209.6" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<circle cx="520.0" cy="209.6" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<text x="194.5" y="104.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >−7%</text>
<text x="370.0" y="237.6" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="middle" font-weight="600" >−16%</text>
<text x="534.0" y="195.6" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >still above</text>
<text x="534.0" y="214.6" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >people who had</text>
<text x="534.0" y="233.6" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >never trained</text>
</svg>

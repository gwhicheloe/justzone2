<text x="383.3" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >day 56</text>
<text x="540.0" y="270.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >day 84</text>
<text x="305.0" y="296.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >Change in VO₂max after training stopped</text>
<polyline points="70.0,40.0 187.5,113.5 383.3,208.0 540.0,208.0" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 507" width="680" height="507" role="img" aria-label="ATP is spent to ADP and rebuilt; when ADP builds up, AMP rises and AMPK switches on">
<rect width="680" height="507" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect x="10" y="76" width="250" height="110" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="135.0" y="104.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600" >ATP</text>
<text x="135.0" y="129.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >three phosphates</text>
<text x="135.0" y="148.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >carries the energy</text>
<rect x="420" y="76" width="250" height="110" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="545.0" y="104.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600" >ADP</text>
<text x="545.0" y="129.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >two phosphates: what is</text>
<text x="545.0" y="148.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >left when ATP is spent</text>
<rect x="420" y="330" width="250" height="110" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="545.0" y="358.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600" >AMP</text>
<text x="545.0" y="383.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >one phosphate</text>
<text x="545.0" y="402.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >rises when ADP builds up</text>
<rect x="10" y="330" width="250" height="110" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="135.0" y="358.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="19" fill="#1a1a1a" text-anchor="middle" font-weight="600" >AMPK</text>
<text x="135.0" y="383.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >the sensor: switches on</text>
<text x="135.0" y="402.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >when AMP rises against ATP</text>
<line x1="266" y1="117.0" x2="412" y2="117.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
<text x="340.0" y="35.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >Contraction</text>
<text x="340.0" y="54.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >splits off a</text>
<text x="340.0" y="73.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >phosphate and</text>
<text x="340.0" y="92.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >releases energy</text>
<line x1="414" y1="145.0" x2="268" y2="145.0" stroke="#1a1a1a" stroke-width="2" marker-end="url(#ah)" />
<text x="340.0" y="173.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >Mitochondria</text>
<text x="340.0" y="192.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >rebuild it, using</text>
<text x="340.0" y="211.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="400" >oxygen and fuel</text>
<line x1="545.0" y1="192" x2="545.0" y2="322" stroke="#555555" stroke-width="2" marker-end="url(#ahg)" stroke-dasharray="5 4"/>
<text x="533.0" y="262.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >when demand</text>
<text x="533.0" y="281.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >outruns supply</text>
<line x1="414" y1="395.0" x2="268" y2="395.0" stroke="#555555" stroke-width="2" marker-end="url(#ahg)" stroke-dasharray="5 4"/>
<text x="340.0" y="363.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >read as a</text>
<text x="340.0" y="382.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >fuel gauge</text>
<text x="340.0" y="474.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >Solid arrows: the cycle that runs all the time. Dashed arrows: what happens when it</text>
<text x="340.0" y="493.4" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >falls behind.</text>
</svg>

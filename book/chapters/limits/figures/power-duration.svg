<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 493" width="680" height="493" role="img" aria-label="A falling curve of best power against duration that flattens towards a dashed critical power line at 250 W: 361 W for 3 minutes, 317 W for 5, 267 W for 20. Above critical power is the severe domain, between it and the first threshold (190 W, illustrative) the heavy domain, and below that the moderate domain.">
<rect width="680" height="493" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >Above critical power every effort has a time limit; below it, the limit</text>
<text x="30.0" y="52.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >is somewhere else</text>
<text x="30.0" y="76.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >The best power a rider can hold for each duration, drawn for a rider with a critical</text>
<text x="30.0" y="95.4" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >power of 250 W and a W′ of 20 kJ. Illustrative numbers, not data.</text>

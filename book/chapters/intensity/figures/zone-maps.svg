<text x="30.0" y="53.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Blood lactate in a test of rising power (a sketch, not data), the two thresholds, and</text>

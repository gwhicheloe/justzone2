<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 593.7" width="680" height="593.7" role="img" aria-label="Sketch of a lactate curve with two thresholds, and beneath it the intensity domains, the three-zone and five-zone models and Coggan’s power levels, each with its second zone shaded in a different place">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510.29999999999995" width="680" height="510.29999999999995" role="img" aria-label="Sketch of a lactate curve with two thresholds, and the three-zone and five-zone models beneath it">

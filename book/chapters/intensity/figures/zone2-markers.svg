<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 592.3" width="680" height="592.3" role="img" aria-label="Average power at nine markers of Zone 2 in 50 trained cyclists, from Meixner 2025">
<rect width="680" height="592.3" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >Nine markers of Zone 2 span about 100 watts in the same riders</text>
<text x="30.0" y="53.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Average power at each marker in 50 trained cyclists tested in one laboratory, with</text>
<text x="30.0" y="72.9" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >the heart rate at that power as a percentage of maximum.</text>

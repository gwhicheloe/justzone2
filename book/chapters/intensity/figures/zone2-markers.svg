<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 496" width="680" height="496" role="img" aria-label="Average power at nine markers of Zone 2 in 50 trained cyclists, from Meixner 2025">
<rect width="680" height="496" fill="#ffffff"/>
<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600" >Nine markers of Zone 2 span about 100 watts in the same riders</text>
<text x="30.0" y="47.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="start" font-weight="400" >Average power at each marker in 50 trained cyclists tested in one laboratory,</text>
<text x="30.0" y="63.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="start" font-weight="400" >with the heart rate at that power as a percentage of maximum.</text>

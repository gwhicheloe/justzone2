<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 354" width="680" height="354" role="img" aria-label="Interval plot. Exercise-based estimates: average error minus 0.1, 95 percent of estimates from minus 10 to plus 10 mL/kg/min. Resting-based estimates: average plus 2.2, from minus 13 to plus 17.">
<rect width="680" height="354" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >Watches estimate VO₂max well on average and can be 10 out for one person</text>
<text x="30.0" y="53.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Error of consumer wearables' VO₂max estimates against laboratory measurement, in</text>
<text x="30.0" y="72.9" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >mL/kg/min: the average error (dot) and the range holding 95% of individual estimates</text>
<text x="30.0" y="92.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >(bar). 14 studies.</text>

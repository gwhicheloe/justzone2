<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 432" width="680" height="432" role="img" aria-label="Interval plot in days: fitness fades over 38 (17 to 59), fatigue over 19 (6 to 32), time to recover performance 19 (7 to 35), time to peak after training stops 43 (25 to 61).">
<rect width="680" height="432" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >The settings behind a fitness and fatigue chart could each be weeks out</text>
<text x="30.0" y="53.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Four settings of the fitness–fatigue model fitted to a season of nine elite swimmers,</text>
<text x="30.0" y="72.9" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >in days: the estimate (dot) and its 95% confidence interval (bar).</text>
<line x1="280.0" y1="118.3" x2="280.0" y2="372.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="280.0" y="394.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >0</text>
<line x1="318.3" y1="118.3" x2="318.3" y2="372.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="318.3" y="394.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >10</text>
<line x1="356.6" y1="118.3" x2="356.6" y2="372.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="356.6" y="394.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >20</text>
<line x1="394.9" y1="118.3" x2="394.9" y2="372.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="394.9" y="394.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >30</text>
<line x1="433.1" y1="118.3" x2="433.1" y2="372.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="433.1" y="394.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >40</text>
<line x1="471.4" y1="118.3" x2="471.4" y2="372.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="471.4" y="394.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >50</text>
<line x1="509.7" y1="118.3" x2="509.7" y2="372.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="509.7" y="394.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >60</text>
<line x1="548.0" y1="118.3" x2="548.0" y2="372.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="548.0" y="394.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >70</text>
<text x="414.0" y="418.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="middle" font-weight="400" >Days</text>
<text x="264.0" y="151.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="end" font-weight="600" >How long fitness takes to fade</text>
<text x="264.0" y="170.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="end" font-weight="400" >fitness time constant</text>
<rect x="345.1" y="148.3" width="160.8" height="14" rx="7" fill="#e6e6e6"/>
<circle cx="425.5" cy="155.3" r="7" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<text x="515.9" y="160.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >38 (17 to 59)</text>
<text x="264.0" y="213.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="end" font-weight="600" >How long fatigue takes to fade</text>
<text x="264.0" y="232.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="end" font-weight="400" >fatigue time constant</text>
<rect x="303.0" y="210.3" width="99.5" height="14" rx="7" fill="#e6e6e6"/>
<circle cx="352.7" cy="217.3" r="7" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<text x="412.5" y="222.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >19 (6 to 32)</text>
<text x="264.0" y="275.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="end" font-weight="600" >Time to recover performance</text>
<text x="264.0" y="294.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="end" font-weight="400" >after a block of training</text>
<rect x="306.8" y="272.3" width="107.2" height="14" rx="7" fill="#e6e6e6"/>
<circle cx="352.7" cy="279.3" r="7" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<text x="424.0" y="284.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >19 (7 to 35)</text>
<text x="264.0" y="337.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="end" font-weight="600" >Time to peak performance</text>
<text x="264.0" y="356.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="end" font-weight="400" >after training stops</text>
<rect x="375.7" y="334.3" width="137.8" height="14" rx="7" fill="#e6e6e6"/>
<circle cx="444.6" cy="341.3" r="7" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<text x="523.5" y="346.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="start" font-weight="400" >43 (25 to 61)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="680" height="470" role="img" aria-label="Simulated weekly readings scattered between about 95 and 109 percent of the starting power, five of them below 100 including the last, while the true power rises steadily to 105 and the four-week average climbs from about 100 to 105.">
<rect width="680" height="470" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >One week’s reading can’t show a 5% gain; a four-week average can</text>
<text x="30.0" y="53.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >A simulated rider whose power at a fixed heart rate truly rises 5% over twelve weeks,</text>
<text x="30.0" y="72.9" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >measured weekly with a typical error of 3%. Values are a percentage of the true</text>
<text x="30.0" y="92.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >starting power.</text>

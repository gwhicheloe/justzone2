<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 479.7" width="680" height="479.7" role="img" aria-label="Bar chart of lower risk of death by amount of leisure activity: 20, 31, 37, 39 and 39 percent from under the guideline minimum to 5 to 10 times it, and 31 percent at 10 times or more">
<rect width="680" height="479.7" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >Most of the lower risk comes with the first few hours a week</text>
<text x="30.0" y="53.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Risk of death against people who reported no leisure activity, by multiples of the</text>
<text x="30.0" y="72.9" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >guideline minimum of 150 minutes of moderate or 75 of vigorous activity a week.</text>
<text x="30.0" y="92.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >661,137 adults in six cohorts.</text>

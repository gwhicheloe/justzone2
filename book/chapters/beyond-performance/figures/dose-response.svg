<text x="660.0" y="133.7" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="end" font-weight="600" >A trained rider on 6 to 10 hours</text>
<text x="660.0" y="152.7" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >a week, roughly (my estimate)</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" role="img" aria-label="Time-trial improvement against carbohydrate dose, from Smith 2013">
<rect width="680" height="380" fill="#ffffff"/>
<text x="30.0" y="28.0" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="600" >Most of the gain from carbohydrate arrives by 50 grams an hour</text>
<text x="30.0" y="47.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="start" font-weight="400" >Improvement in a 20 km time trial after a two-hour ride, against a placebo drink. 51 cyclists.</text>
<rect x="414.5" y="90" width="185.5" height="200" fill="#f3f3f3"/>
<line x1="70" y1="290.0" x2="600" y2="290.0" stroke="#1a1a1a" stroke-width="1"/>
<text x="60.0" y="294.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >0</text>
<line x1="70" y1="250.0" x2="600" y2="250.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="254.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >+1%</text>
<line x1="70" y1="210.0" x2="600" y2="210.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="214.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >+2%</text>
<line x1="70" y1="170.0" x2="600" y2="170.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="174.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >+3%</text>
<line x1="70" y1="130.0" x2="600" y2="130.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="134.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >+4%</text>
<line x1="70" y1="90.0" x2="600" y2="90.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="94.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >+5%</text>
<text x="70.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >0</text>
<text x="202.5" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >30</text>
<text x="335.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >60</text>
<text x="467.5" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >90</text>
<text x="600.0" y="310.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >120</text>
<text x="335.0" y="336.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >Carbohydrate drunk during the ride (grams an hour)</text>
<polyline points="70.0,290.0 109.8,250.0 153.9,210.0 206.9,170.0 282.0,130.0 414.5,102.0" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
<circle cx="109.8" cy="250.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<circle cx="153.9" cy="210.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<circle cx="206.9" cy="170.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<circle cx="282.0" cy="130.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<circle cx="414.5" cy="102.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<text x="272.0" y="118.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600" >+4.0% at 48</text>
<text x="414.5" y="88.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600" >+4.7% at 78, the peak</text>
<text x="507.2" y="186.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >above 78 the</text>
<text x="507.2" y="202.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >benefit shrank</text>
<text x="507.2" y="218.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle" font-weight="400" >(sizes not reported</text>
<text x="507.2" y="232.0" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#555555" text-anchor="middle" font-weight="400" >in the abstract)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 497" width="680" height="497" role="img" aria-label="Bars of weekly hours over twenty weeks: 6 rising by half an hour a week to 9.5 by week 10, every fourth week about 30 percent lighter with one hard session, and a two-week taper at 5.75 and 4.25 hours with both hard sessions kept.">

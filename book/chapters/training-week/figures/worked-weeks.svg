<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 645" width="680" height="645" role="img" aria-label="Three example weeks. 4 hours: Tuesday 1 hour hard (4 by 8), Thursday 1 hour easy, Saturday 1.25 hours hard (30/15), Sunday 0.75 easy. 8 hours: Tuesday 1.25 hard, Wednesday 1.5 easy, Thursday 1 easy, Friday 1.25 hard, Saturday 3 long. 12 hours: Tuesday 1.5 hard (5 by 8), Wednesday 2 easy, Thursday 1.5 easy, Friday 1.5 hard, Saturday 4 long, Sunday 1.5 easy. Hard work 52, 52 and 60 minutes.">
<rect width="680" height="645" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >The hard sessions stay the same from 4 hours to 12; the easy riding</text>

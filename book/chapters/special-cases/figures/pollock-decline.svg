<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 452" width="680" height="452" role="img" aria-label="Line chart of VO2max as a percentage of the start over twenty years: remained elite 100, 92, 78; kept training moderately 100, 87, 75; greatly reduced training (two people) 100, 82, 54.">
<rect width="680" height="452" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >Older athletes who kept training hard lost the least, but everyone lost</text>
<text x="30.0" y="53.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >VO₂max as a percentage of each group's value at the start, when their average age was</text>
<text x="30.0" y="72.9" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >about 50, measured again 10 and 20 years later.</text>
<line x1="80" y1="388.3" x2="430" y2="388.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="70.0" y="393.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >50%</text>
<line x1="80" y1="336.3" x2="430" y2="336.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="70.0" y="341.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >60%</text>
<line x1="80" y1="284.3" x2="430" y2="284.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="70.0" y="289.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >70%</text>
<line x1="80" y1="232.3" x2="430" y2="232.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="70.0" y="237.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >80%</text>
<line x1="80" y1="180.3" x2="430" y2="180.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="70.0" y="185.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >90%</text>
<line x1="80" y1="128.3" x2="430" y2="128.3" stroke="#e6e6e6" stroke-width="1"/>
<text x="70.0" y="133.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="end" font-weight="400" >100%</text>
<text x="90.0" y="412.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="600" >Start</text>
<text x="90.0" y="431.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="middle" font-weight="400" >age about 50</text>
<text x="255.0" y="412.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="600" >10 years</text>
<text x="255.0" y="431.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="middle" font-weight="400" >age about 60</text>
<text x="420.0" y="412.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="middle" font-weight="600" >20 years</text>
<text x="420.0" y="431.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#555555" text-anchor="middle" font-weight="400" >age about 70</text>
<polyline points="90.0,128.3 255.0,169.9 420.0,241.7" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
<circle cx="90.0" cy="128.3" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="255.0" cy="169.9" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="420.0" cy="241.7" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="1.5"/>
<polyline points="90.0,128.3 255.0,195.9 420.0,259.3" fill="none" stroke="#555555" stroke-width="2.5"/>
<circle cx="90.0" cy="128.3" r="5" fill="#555555" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="255.0" cy="195.9" r="5" fill="#555555" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="420.0" cy="259.3" r="5" fill="#555555" stroke="#ffffff" stroke-width="1.5"/>
<polyline points="90.0,128.3 255.0,221.9 420.0,367.0" fill="none" stroke="#555555" stroke-width="2.5" stroke-dasharray="6 5"/>
<circle cx="90.0" cy="128.3" r="5" fill="#555555" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="255.0" cy="221.9" r="5" fill="#555555" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="420.0" cy="367.0" r="5" fill="#555555" stroke="#ffffff" stroke-width="1.5"/>
<text x="436.0" y="215.7" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >Stayed elite (9)</text>
<text x="436.0" y="234.7" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >78% after 20 years</text>
<text x="436.0" y="273.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >Trained moderately (10)</text>
<text x="436.0" y="292.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >75% after 20 years</text>
<text x="436.0" y="367.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="16.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >Cut right back (2)</text>
<text x="436.0" y="386.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >54% after 20 years</text>
</svg>

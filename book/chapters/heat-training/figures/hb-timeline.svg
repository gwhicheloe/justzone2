<line x1="70" y1="56.0" x2="560" y2="56.0" stroke="#bdbdbd" stroke-width="1"/>
<text x="60.0" y="60.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >+5%</text>
<text x="70.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >start</text>
<text x="280.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >week 3</text>
<text x="420.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >week 5</text>
<text x="560.0" y="282.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >week 7</text>
<text x="315.0" y="308.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="middle" font-weight="400" >Change in total haemoglobin mass</text>
<polyline points="70.0,262.0 280.0,138.4 420.0,97.2 560.0,262.0" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>

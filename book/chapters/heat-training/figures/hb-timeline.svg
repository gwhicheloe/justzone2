<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" role="img" aria-label="Haemoglobin mass during five weeks of heat training and two weeks after stopping">
<rect width="680" height="340" fill="#ffffff"/>
<rect x="70.0" y="56" width="350.0" height="206" fill="#e6e6e6"/>

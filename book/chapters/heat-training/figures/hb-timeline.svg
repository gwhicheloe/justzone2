<circle cx="560.0" cy="262.0" r="5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<text x="270.0" y="126.4" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600" >+3%</text>
<text x="420.0" y="83.2" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="600" >+4%</text>

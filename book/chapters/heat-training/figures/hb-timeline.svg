<text x="60.0" y="183.6" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#555555" text-anchor="end" font-weight="400" >+2%</text>
<line x1="70" y1="138.4" x2="560" y2="138.4" stroke="#bdbdbd" stroke-width="1"/>

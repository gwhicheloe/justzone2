<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 453.7" width="680" height="453.7" role="img" aria-label="Peak fat burning at 63, 60, 52 and 56 percent of VO2max in four feeding conditions, with the first lactate rise at 61 percent in the first and 69 percent in the last">
<rect width="680" height="453.7" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >After carbohydrate, peak fat burning falls below the first threshold</text>
<text x="30.0" y="53.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >The intensity at which fat burning peaked in four feeding conditions, and the</text>
<text x="30.0" y="72.9" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >intensity of the first rise in blood lactate in the two studies that measured it.</text>
<text x="30.0" y="92.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Both as a percentage of VO₂max.</text>
<circle cx="36" cy="137.7" r="5.5" fill="#1a1a1a"/>
<text x="50.0" y="142.7" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#1a1a1a" text-anchor="start" font-weight="600" >Peak fat burning</text>

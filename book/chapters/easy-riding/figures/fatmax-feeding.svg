<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 551.7" width="680" height="551.7" role="img" aria-label="Three separate studies. Peak fat burning at 63, 60, 52 and 56 percent of VO2max in four feeding conditions, with the first lactate rise at 61 percent in the first and 69 percent in the last">
<rect width="680" height="551.7" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >Carbohydrate before a ride moved peak fat burning to a lower intensity</text>
<text x="30.0" y="53.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Where fat burning peaked, and where blood lactate first rose, as a percentage of</text>
<text x="30.0" y="72.9" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >VO₂max, in three separate studies. Compare points within a study, not across them:</text>
<text x="30.0" y="92.3" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >each tested different people in a different way.</text>

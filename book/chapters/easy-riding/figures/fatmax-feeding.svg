<text x="424.7" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="400" paint-order="stroke" stroke="#ffffff" stroke-width="4">61%</text>
<circle cx="460.0" cy="153.0" r="5.5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<text x="472.0" y="157.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="4">63%</text>
<text x="230.0" y="197.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600" >After an overnight fast</text>
<text x="230.0" y="212.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#555555" text-anchor="end" font-weight="400" >11 trained people</text>
<circle cx="426.2" cy="199.0" r="5.5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<text x="438.2" y="203.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="4">60%</text>
<text x="230.0" y="243.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600" >45 min after 75 g of glucose</text>
<text x="230.0" y="258.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#555555" text-anchor="end" font-weight="400" >the same 11 people</text>
<circle cx="331.7" cy="245.0" r="5.5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<text x="343.7" y="249.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="4">52%</text>
<text x="230.0" y="289.0" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="end" font-weight="600" >3 h after a carbohydrate meal</text>
<text x="230.0" y="304.0" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#555555" text-anchor="end" font-weight="400" >50 trained cyclists</text>
<line x1="378.3" y1="291.0" x2="534.7" y2="291.0" stroke="#bdbdbd" stroke-width="1.5"/>
<rect x="529.2" y="285.5" width="11" height="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="546.7" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="400" paint-order="stroke" stroke="#ffffff" stroke-width="4">69%</text>
<circle cx="378.3" cy="291.0" r="5.5" fill="#1a1a1a" stroke="#ffffff" stroke-width="2"/>
<text x="366.3" y="295.0" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="600" paint-order="stroke" stroke="#ffffff" stroke-width="4">56%</text>
</svg>

<text x="30.0" y="394.8" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Schematic, from the review’s finding that the heart’s nervous control took at least</text>
<text x="30.0" y="414.2" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >48 hours to recover after high-intensity sessions, against up to 24 hours after easy</text>
<text x="30.0" y="433.6" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >ones.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 453" width="680" height="453" role="img" aria-label="Three weeks with two hard sessions each: Tuesday and Friday, 72 hours apart; Tuesday and Thursday, 48 hours apart; Tuesday and Wednesday, 24 hours apart, where the second session starts inside the first one’s 48-hour recovery window.">
<rect width="680" height="453" fill="#ffffff"/>
<text x="30.0" y="30.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >With at least 48 hours to recover, a second hard session two days later</text>
<text x="30.0" y="52.5" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="start" font-weight="600" >starts fresh; one a day later doesn’t</text>
<text x="30.0" y="76.0" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >Two hard sessions in a week (black) and the 48 hours or more of recovery that hard</text>
<text x="30.0" y="95.4" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="15.5" fill="#555555" text-anchor="start" font-weight="400" >sessions needed in the pooled studies (grey).</text>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#F3F5F2; --surface:#FFFFFF; --ink:#18201B; --muted:#5B6660; --faint:#8A948E; --rule:#DCE2DD;
    --accent:#1E7F45; --easy:#2E8B53; --easy-soft:#E3F1E8; --hard:#BF5F24; --hard-soft:#F8E8DD;
    --neutral:#3D5A73; --neutral-soft:#E4EBF1; --chip-new:#EEF0EE;
    --display:"Newsreader", Georgia, "Times New Roman", serif;
    --body:"IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1311; --surface:#161B18; --ink:#E3E9E4; --muted:#9AA59E; --faint:#6F7A73; --rule:#29312C;
      --accent:#52C482; --easy:#52C482; --easy-soft:#16291D; --hard:#EA9257; --hard-soft:#2E1E14;
      --neutral:#93B4D0; --neutral-soft:#18232D; --chip-new:#202723; color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1311; --surface:#161B18; --ink:#E3E9E4; --muted:#9AA59E; --faint:#6F7A73; --rule:#29312C;
    --accent:#52C482; --easy:#52C482; --easy-soft:#16291D; --hard:#EA9257; --hard-soft:#2E1E14;
    --neutral:#93B4D0; --neutral-soft:#18232D; --chip-new:#202723; color-scheme:dark;
  }
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
  .wrap{max-width:840px;margin:0 auto;padding-inline:20px;padding-block:44px 80px}
  h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0}
  p{margin:0}
  a{color:var(--accent)}

  /* Title block */
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:clamp(44px,9vw,76px);line-height:1;letter-spacing:-.02em;margin-top:14px}
  h1 em{font-style:italic;color:var(--accent)}
  .lede{font-size:18px;color:var(--muted);max-width:60ch;margin-top:16px}
  .facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:22px;font-family:var(--mono);font-size:13px;color:var(--muted)}
  .facts b{color:var(--ink);font-weight:500}

  section.block{margin-top:52px}
  .block > h2{font-size:28px}
  .block > .sub{color:var(--muted);margin-top:6px;max-width:62ch}

  /* The spine: the four-part model */
  .formula{font-family:var(--mono);font-size:14px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;
    padding:14px 16px;margin-top:18px;line-height:1.7}
  .formula span{color:var(--accent)}
  .factors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
  .factor{border-top:2px solid var(--ink);padding-top:10px}
  .factor h3{font-size:19px}
  .factor p{font-size:14px;color:var(--muted);margin-top:4px}
  .factor .chs{font-family:var(--mono);font-size:12px;color:var(--faint);margin-top:8px}

  /* Contents */
  .part{margin-top:34px}
  .part-head{display:grid;grid-template-columns:auto 1fr auto;column-gap:14px;align-items:baseline;padding:14px 16px;border-radius:10px}
  .part-label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}
  .part-head h2{font-size:26px}
  .part-blurb{grid-column:1 / -1;color:var(--muted);font-size:15px;margin-top:2px}
  .part-words{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .part-easy .part-head{background:var(--easy-soft)} .part-easy .part-label{color:var(--easy)}
  .part-hard .part-head{background:var(--hard-soft)} .part-hard .part-label{color:var(--hard)}
  .part-neutral .part-head{background:var(--neutral-soft)} .part-neutral .part-label{color:var(--neutral)}
  .part-front{margin-top:22px}

  .ch{display:grid;grid-template-columns:56px minmax(0,1fr) 150px;gap:16px;padding:22px 4px;border-bottom:1px solid var(--rule)}
  .ch-num{font-family:var(--display);font-size:34px;line-height:1;color:var(--faint);font-variant-numeric:lining-nums}
  .ch-num.word{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding-top:8px}
  .part-easy .ch-num{color:var(--easy)} .part-hard .ch-num{color:var(--hard)}
  .ch h3{font-size:22px;line-height:1.2}
  .ch-q{font-family:var(--display);font-style:italic;font-size:17px;color:var(--muted);margin-top:4px}
  .ch-covers{margin:10px 0 0;padding-left:18px;font-size:15px}
  .ch-covers li{margin:3px 0}
  .ch-src{font-size:13px;color:var(--muted);margin-top:10px;line-height:1.55}
  .ch-src span{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-right:6px}
  .ch-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
  .ch-words{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .chip{font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .chip-exists{background:var(--easy-soft);color:var(--easy)}
  .chip-partly{background:var(--hard-soft);color:var(--hard)}
  .chip-new{background:var(--chip-new);color:var(--muted);border:1px solid var(--rule)}
  .ch-status{font-size:13px;color:var(--muted);margin-top:8px}
  .ch-status b{color:var(--ink);font-weight:600}

  /* Features and decisions */
  .features{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 28px;margin-top:18px}
  .features h3{font-size:19px}
  .features p{font-size:15px;color:var(--muted);margin-top:4px}
  .grades{font-family:var(--mono);font-size:13px;margin-top:8px;display:grid;gap:4px}
  .grades b{display:inline-block;width:24px;color:var(--ink)}
  .back{margin-top:16px;font-size:15px;color:var(--muted)}
  .back li{margin:4px 0}
  .decisions{margin-top:16px;display:grid;gap:14px}
  .decision{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px 18px}
  .decision h3{font-family:var(--body);font-size:16px;font-weight:600}
  .decision p{font-size:15px;color:var(--muted);margin-top:4px}
  .decision ul{margin:8px 0 0;padding-left:18px;font-size:15px}
  .decision li{margin:3px 0}
  .decision .rec{font-size:14px;margin-top:8px;color:var(--ink)}
  .decision .rec b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-right:6px}
  .foot{margin-top:56px;padding-top:18px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}

  @media (max-width:680px){
    .factors{grid-template-columns:repeat(2,minmax(0,1fr))}
    .features{grid-template-columns:1fr}
    .ch{grid-template-columns:40px minmax(0,1fr);gap:12px}
    .ch-num{font-size:28px}
    .ch-side{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;gap:12px}
    .part-head{grid-template-columns:1fr}
    .part-words{margin-top:2px}
  }
</style>
